[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protein-etl"
version = "0.1.0"
description = "ETL pipeline and CLI helper for The Protein Discovery Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "supabase>=2.0.0",
    "rich>=13.7.0",
    "questionary>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ocr = [
    "rapidocr>=3.4",
    "onnxruntime>=1.17",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
protein-etl = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]

